name: build-release

# Pokreće se ručno. Windows build se ne može napraviti na macOS-u, a predaja traži Windows Release i APK
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Windows build
        working-directory: torvin.frontend/torvin_desktop
        run: |
          flutter clean
          flutter pub get
          flutter build windows --release --dart-define=API_BASE_URL=http://localhost:5080

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: torvin.frontend/torvin_desktop/build/windows/x64/runner/Release/
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Android build
        working-directory: torvin.frontend/torvin_mobile
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --dart-define=API_BASE_URL=http://10.0.2.2:5080

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: torvin.frontend/torvin_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
