name: ci

on:
  pull_request:
    branches: [development, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Backend build
        working-directory: torvin.backend
        run: dotnet build Torvin.slnx -warnaserror

      - name: Backend testovi
        working-directory: torvin.backend
        run: dotnet test Torvin.slnx --no-build

      - name: torvin_core
        working-directory: torvin.frontend/torvin_core
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: torvin_mobile
        working-directory: torvin.frontend/torvin_mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: torvin_desktop
        working-directory: torvin.frontend/torvin_desktop
        run: |
          flutter pub get
          flutter analyze
          flutter test
